name: Build and push image

# Builds the Docker image and pushes it to this repository's container registry:
#   ghcr.io/<owner>/<repo>
# Runs on every push to main, on version tags (v1.2.3), and by hand from the Actions tab.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "test/**"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # lets the built-in GITHUB_TOKEN push to ghcr.io

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # QEMU + Buildx make one image that runs on a PC (amd64) and on a Raspberry Pi (arm64, arm/v7)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image name (lower-cased) and tags:
      #   latest   on main
      #   sha-…    for every build
      #   1.2.3, 1.2   when a v1.2.3 tag is pushed
      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
